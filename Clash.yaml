# Clash 配置模板
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: true
udp: true

unified-delay: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
 
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true

dns:
  enable: true
  prefer-h3: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - localhost.ptlogin2.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.msftconnecttest.com
  - +.msftncsi.com
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

# ======= 锚点定义 =======

# 锚点 - 自动选择 [每 6 秒一次惰性健康检查，容差 20ms，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
at: &at {type: url-test, interval: 300, tolerance: 20, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true}

# 锚点 - 故障转移 [每 6 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
fb: &fb {type: fallback, interval: 300, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}

# 规则参数 [每天更新一次订阅规则，更新规则时使用Proxy策略]
RuleSet: &RuleSet {type: http, behavior: classical, interval: 86400, format: yaml, proxy: Proxy}

#节点过滤
Filter-HK: &Filter-HK '香港|HK|HongKong'
Filter-TW: &Filter-TW '台湾|TW|Taiwan'
Filter-US: &Filter-US '美国|US|America'
Filter-UK: &Filter-UK '英国|UK|England'
Filter-JP: &Filter-JP '日本|JP|Japan'
Filter-KR: &Filter-KR '韩国|KR|Korea'
Filter-SG: &Filter-SG '新加坡|SG|Singapore'

#节点列表
proxies:


proxy-groups:
#显示地区节点/全部节点
  - {name: Proxy, type: select, proxies: [Select,DIRECT,SG,HK,TW,US,UK,JP,KR]}
  - {name: Select, type: select, include-all: true}

#隐藏广告拦截/兜底策略
  - {name: Reject, type: select, proxies: [REJECT], hidden: true}
  - {name: Match, type: select, proxies: [Proxy,DIRECT], hidden: true}
#过滤设置
  - {name: HK, <<: *at, filter: *Filter-HK, include-all: true}
  - {name: TW, <<: *at, filter: *Filter-TW, include-all: true}
  - {name: US, <<: *at, filter: *Filter-US, include-all: true}
  - {name: UK, <<: *at, filter: *Filter-UK, include-all: true}
  - {name: JP, <<: *at, filter: *Filter-JP, include-all: true}
  - {name: KR, <<: *at, filter: *Filter-KR, include-all: true}
  - {name: SG, <<: *at, filter: *Filter-SG, include-all: true}

# ======= 规则集 =======
rule-providers:

  reject:
    <<: *RuleSet
    url: "https://cdn.jsdelivr.net/gh/jkjkit/clash@main/Reject.txt"
    path: ./profiles/rules/reject.txt

  proxy:
    <<: *RuleSet
    url: "https://cdn.jsdelivr.net/gh/jkjkit/clash@main/Proxy.txt"
    path: ./profiles/rules/proxy.txt

  direct:
    <<: *RuleSet
    url: "https://cdn.jsdelivr.net/gh/jkjkit/clash@main/Direct.txt"
    path: ./profiles/rules/direct.txt

  software:
    <<: *RuleSet
    url: "https://cdn.jsdelivr.net/gh/jkjkit/clash@main/Software.txt"
    path: ./profiles/rules/software.txt

# ======= 规则 =======

rules:

  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

  - RULE-SET,software,DIRECT
  - RULE-SET,reject,Reject
  - RULE-SET,proxy,Proxy
  - RULE-SET,direct,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,Match
