# ======= 基础配置 =======
mixed-port: 7890
mode: rule
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com

# ======= 锚点定义 =======

# 自动选择
at: &at {type: url-test, interval: 300, tolerance: 20, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, include-all: true, hidden: true}
# 故障转移
fb: &fb {type: fallback, interval: 300, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}

# 域名规则
DO: &DO {type: http, behavior: domain, format: text, interval: 86400}
# 地址规则
IP: &IP {type: http, behavior: ipcidr, format: text, interval: 86400}

# ======= 代理节点 =======
proxies: 


proxy-groups:
  - {name: Proxy, type: select, proxies: [Select,SG,HK,TW,US,UK,JP,KR,DIRECT]}
  - {name: Select, type: select, include-all: true}

  - {name: HK, <<: *at, filter: '香港|HK|HongKong'}
  - {name: TW, <<: *at, filter: '台湾|TW|Taiwan'}
  - {name: US, <<: *at, filter: '美国|US|America'}
  - {name: UK, <<: *at, filter: '英国|UK|England'}
  - {name: JP, <<: *at, filter: '日本|JP|Japan'}
  - {name: KR, <<: *at, filter: '韩国|KR|Korea'}
  - {name: SG, <<: *at, filter: '新加坡|SG|Singapore'}


# ======= 分流规则 =======
rule-providers:
  do-direct:  {<<: *DO, url: https://raw.githubusercontent.com/jkjkit/clash/main/domain/direct.list}
  do-proxy:   {<<: *DO, url: https://raw.githubusercontent.com/jkjkit/clash/main/domain/proxy.list}
  do-reject:  {<<: *DO, url: https://raw.githubusercontent.com/jkjkit/clash/main/domain/reject.list}
  ip-direct:  {<<: *IP, url: https://raw.githubusercontent.com/jkjkit/clash/main/ipcidr/direct.list}
  ip-proxy:   {<<: *IP, url: https://raw.githubusercontent.com/jkjkit/clash/main/ipcidr/proxy.list}

rules:
  - RULE-SET,do-reject,REJECT
  - RULE-SET,do-direct,DIRECT
  - RULE-SET,do-proxy,Proxy
  - RULE-SET,ip-direct,DIRECT
  - RULE-SET,ip-proxy,Proxy
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
