# update: 2026-02-21
# 简介: https://github.com/echs-top/proxy

# 节点IP优先级 
# override: { ip-version: ipv6-prefer }
providers: &providers { type: http, interval: 86400, proxy: 直接连接, header: { User-Agent: ["clash-verge/v2.4.5"] }, health-check: { enable: true, url: 'https://dns.google/generate_204', expected-status: 204,  interval: 600, timeout: 3000, max-failed-times: 2, lazy: false }, exclude-filter: '(?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|海外' }
proxy-providers:
  link1: { <<: *providers, url: '订阅链接', path: ./providers/link1.yaml }
  link2: { <<: *providers, url: '备用机场', path: ./providers/link2.yaml }
# 策略分组
use: &use { use: [link1,link2] }

ipv6: true
allow-lan: false
bind-address: '*'
mode: rule
log-level: error
unified-delay: true
tcp-concurrent: true
find-process-mode: off
disable-keep-alive: false
keep-alive-interval: 15
keep-alive-idle: 300
etag-support: true
# global-ua: 'Mozilla/5.0 (Linux; Android 16; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.7559.132 Mobile Safari/537.36'
# external-controller: 127.0.0.1:9090
# secret: '密码'
# external-ui: ./zashboard
# external-ui-url: 'https://cdn.gh-proxy.org/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
# geodata-loader: standard
# geo-auto-update: true
# geo-update-interval: 24
# geox-url: { asn: "https://cdn.gh-proxy.org/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb" }
lgbm-auto-update: true
lgbm-update-interval: 24
lgbm-url: 'https://cdn.gh-proxy.org/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin'
profile: { store-selected: true, store-fake-ip: true, UrlTest-collector-size: 1024 }
# experimental: { quic-go-disable-gso: true, quic-go-disable-ecn: true, dialer-ip4p-convert: false }
port: 0
socks-port: 0
mixed-port: 0
tproxy-port: 0
redir-port: 0
# authentication: ["用户:密码"]
tun:
  enable: true
  # device: meta
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  disable-icmp-forwarding: true
  dns-hijack: [any:53,tcp://any:53]
  # mtu: 9000
  # udp-timeout: 300
ip: &ip { type: http, interval: 86400, proxy: 直接连接, behavior: ipcidr, format: mrs }
domain: &domain { type: http, interval: 86400, proxy: 直接连接, behavior: domain, format: mrs }
rule-providers:
  private_ip: { <<: *ip, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/privateip.mrs',  path: ./rules/private_ip.mrs }
  AWAvenue-Ads: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/AWAvenue-Ads_domain.mrs', path: ./rules/AWAvenue-Ads.mrs }
  private: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.mrs', path: ./rules/private.mrs }
  fcm: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/fcm_domain.mrs', path: ./rules/fcm.mrs }
  ai: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ai.mrs', path: ./rules/ai.mrs }
  google-cn: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/google-cn.mrs', path: ./rules/google-cn.mrs }
  apple-cn: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/apple-cn.mrs', path: ./rules/apple-cn.mrs }
  microsoft-cn: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.mrs', path: ./rules/microsoft-cn.mrs }
  games-cn: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games-cn.mrs', path: ./rules/games-cn.mrs }
  direct_domain: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/direct_domain.mrs', path: ./rules/direct_domain.mrs }
  proxy: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.mrs', path: ./rules/proxy.mrs }
  cn: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/cn_domain.mrs', path: ./rules/cn.mrs }
  dnsmasq-china-add: { <<: *domain, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/dnsmasq-china-add_domain.mrs', path: ./rules/dnsmasq-china-add.mrs }
  telegram_ip: { <<: *ip, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/telegram_ip.mrs', path: ./rules/telegram_ip.mrs }
  enhanced-FaaS-in-China_ip: { <<: *ip, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/enhanced-FaaS-in-China_ip.mrs', path: ./rules/enhanced-FaaS-in-China_ip.mrs }
  direct_ip: { <<: *ip, url: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/rules/mrs/direct_ip.mrs', path: ./rules/direct_ip.mrs }
  cn_ip: { <<: *ip, url: 'https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cnip.mrs', path: ./rules/cn_ip.mrs }
rules:
  - DST-PORT,5228-5230,FCM推送
  - RULE-SET,private_ip,直接连接,no-resolve
  - RULE-SET,AWAvenue-Ads,REJECT
  - RULE-SET,private,直接连接
  - RULE-SET,fcm,FCM推送
  - RULE-SET,ai,国外AI
  - RULE-SET,google-cn,直接连接
  - RULE-SET,apple-cn,直接连接
  - RULE-SET,microsoft-cn,直接连接
  - RULE-SET,games-cn,直接连接
  - RULE-SET,direct_domain,直接连接
  - RULE-SET,proxy,代理连接
  - RULE-SET,cn,直接连接
  - RULE-SET,telegram_ip,TELEGRAM
  - RULE-SET,enhanced-FaaS-in-China_ip,直接连接
  - RULE-SET,direct_ip,直接连接
  - RULE-SET,cn_ip,直接连接
  - MATCH,代理连接
sniffer: 
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80,8080-8880] }
    TLS: { ports: [443,8443] }
    QUIC: { ports: [443,8443] }
  skip-domain: ['rule-set:private']
  skip-src-address: ['rule-set:private_ip']
  skip-dst-address: ['rule-set:private_ip']
hosts:
  dns.alidns.com: [223.5.5.5,223.6.6.6,'2400:3200::1','2400:3200:baba::1']
  doh.pub: [120.53.53.53,1.12.12.21]
  dns.google: [8.8.8.8,8.8.4.4,'2001:4860:4860::8888','2001:4860:4860::8844']
  dns.quad9.net: [9.9.9.9,149.112.112.112,'2620:fe::fe','2620:fe::9']
  services.googleapis.cn: services.googleapis.com
direct-dns: &direct-dns ['https://dns.alidns.com/dns-query#直接连接','https://doh.pub/dns-query#直接连接&h3=false']
proxy-dns: &proxy-dns ['https://dns.google/dns-query#代理DNS','https://dns.quad9.net/dns-query#代理DNS']
dns: 
  enable: true
  cache-algorithm: arc
  ipv6: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  # listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd00:bada:55ed::1/64
  # fake-ip-ttl: 3
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,AWAvenue-Ads,fake-ip
    - RULE-SET,private,real-ip
    - RULE-SET,fcm,fake-ip
    - RULE-SET,ai,fake-ip
    - RULE-SET,google-cn,real-ip
    - RULE-SET,apple-cn,real-ip
    - RULE-SET,microsoft-cn,real-ip
    - RULE-SET,games-cn,real-ip
    - RULE-SET,direct_domain,real-ip
    - RULE-SET,proxy,fake-ip
    - RULE-SET,cn,real-ip
    - MATCH,fake-ip
  default-nameserver: [223.5.5.5,119.29.29.29]
  proxy-server-nameserver: *direct-dns
  nameserver-policy:
    'rule-set:AWAvenue-Ads': [rcode://name_error]
    'rule-set:private': *direct-dns
    'rule-set:googlefcm': *direct-dns
    'rule-set:ai': *proxy-dns
    'rule-set:google-cn': *direct-dns
    'rule-set:apple-cn': *direct-dns
    'rule-set:microsoft-cn': *direct-dns
    'rule-set:games-cn': *direct-dns
    'rule-set:direct_domain': *direct-dns
    'rule-set:proxy': *proxy-dns
    'rule-set:cn': *direct-dns
    'rule-set:dnsmasq-china-add': *direct-dns
  nameserver: *proxy-dns
  direct-nameserver: *direct-dns
  direct-nameserver-follow-policy: true
proxies: [{ name: ipv4-prefer, type: direct, udp: true, ip-version: ipv4-prefer },{ name: ipv6-prefer, type: direct, udp: true, ip-version: ipv6-prefer }]
zl: &zl { type: select, proxies: [直接连接,代理连接,最低延迟,香港|智能选择,台湾|智能选择,新加坡|智能选择,日本|智能选择,韩国|智能选择,美国|智能选择,加拿大|智能选择,德国|智能选择,英国|智能选择,法国|智能选择,荷兰|智能选择], include-all-providers: true }
dl: &dl { type: select, proxies: [代理连接,直接连接,最低延迟,香港|智能选择,台湾|智能选择,新加坡|智能选择,日本|智能选择,韩国|智能选择,美国|智能选择,加拿大|智能选择,德国|智能选择,英国|智能选择,法国|智能选择,荷兰|智能选择], include-all-providers: true }

# 锚点 - 自动选择 [每 6 秒一次惰性健康检查，容差 20ms，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
UrlTest: &UrlTest {type: url-test, interval: 6, tolerance: 20, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}
# 锚点 - 故障转移 [每 6 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
FallBack: &FallBack {type: fallback, interval: 6, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}

proxy-groups:
  - { name: 代理连接, type: select, proxies: [最低延迟,香港|智能选择,台湾|智能选择,新加坡|智能选择,日本|智能选择,韩国|智能选择,美国|智能选择,加拿大|智能选择,德国|智能选择,英国|智能选择,法国|智能选择,荷兰|智能选择], include-all-providers: true, icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/icon/Global.webp' }
  - { name: 直接连接, type: select, proxies: [DIRECT,ipv4-prefer,ipv6-prefer], icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/icon/DIRECT.webp' }
  - { name: 代理DNS, <<: *dl, icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/icon/Server.webp' }
  - { name: FCM推送, <<: *zl, icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/icon/FCM_Firebase_Cloud_Messaging.webp' }
  - { name: TELEGRAM, <<: *dl, icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/icon/Telegram.webp' }
  - { name: 国外AI, <<: *dl, icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/echs-top/proxy/main/icon/AI.webp' }
  - { name: 最低延迟, type: url-test, tolerance: 30, <<: *use, hidden: true, icon: 'https://cdn.gh-proxy.com/https://raw.githubusercontent.com/echs-top/proxy/main/icon/Fast.webp' }
  - { name: 香港|智能选择, <<: *UrlTest, filter: '(?i)🇭🇰|香港|\bHK\b|\bhongkong\b|\bhong\s?kong\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/hk.svg' }
  - { name: 台湾|智能选择, <<: *UrlTest, filter: '(?i)🇹🇼|台湾|\bTW\b|\btaiwan\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/tw.svg' }
  - { name: 新加坡|智能选择, <<: *UrlTest, filter: '(?i)🇸🇬|新加坡|狮城|\bSG\b|\bsingapore\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/sg.svg' }
  - { name: 日本|智能选择, <<: *UrlTest, filter: '(?i)🇯🇵|日本|\bJP\b|\bjapan\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/jp.svg' }
  - { name: 韩国|智能选择, <<: *UrlTest, filter: '(?i)🇰🇷|韩国|\bKR\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/kr.svg' }
  - { name: 美国|智能选择, <<: *UrlTest, filter: '(?i)🇺🇸|美国|\bUS\b|\bunitedstates\b|\bunited\s?states\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/us.svg' }
  - { name: 加拿大|智能选择, <<: *UrlTest, filter: '(?i)🇨🇦|加拿大|\bCA\b|\bcanada\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/ca.svg' }
  - { name: 德国|智能选择, <<: *UrlTest, filter: '(?i)🇩🇪|德国|\bDE\b|\bgermany\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/de.svg' }
  - { name: 英国|智能选择, <<: *UrlTest, filter: '(?i)🇬🇧|英国|\bUK\b|\bGB\b|\bunitedkingdom\b|\bunited\s?kingdom\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/gb.svg' }
  - { name: 法国|智能选择, <<: *UrlTest, filter: '(?i)🇫🇷|法国|\bFR\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/fr.svg' }
  - { name: 荷兰|智能选择, <<: *UrlTest, filter: '(?i)🇳🇱|荷兰|\bNL\b|\bnetherlands?\b', icon: 'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/nl.svg' }
