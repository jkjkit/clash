# 标准版-按场景分流
port: 7890
socks-port: 7891

allow-lan: true
mode: rule
log-level: info
ipv6: true
udp: true

unified-delay: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

geox-url:
  geoip: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat'
  geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

dns:
  enable: true
  prefer-h3: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - +.lan
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

# ======= 锚点定义 =======

#节点检测 [每24小时更新一次订阅节点，每 60 秒一次健康检查]
pr: &pr {type: http, interval: 86400, health-check: {enable: true, interval: 60, url: "http://www.gstatic.com/generate_204"}}

#故障转移 [每 10 秒一次惰性健康检查，时延超过 3 秒判定为失败，失败 3 次则自动触发健康检查]
failover: &failover {type: fallback, lazy: true, interval: 10, url: "http://www.gstatic.com/generate_204", timeout: 3000, max-failed-times: 3, hidden: true, include-all-providers: true}

#规则参数 [每天更新一次订阅规则，更新规则时使用Proxy策略]
RuleSet: &RuleSet {type: http, interval: 86400, format: yaml, proxy: Proxy}

#节点过滤 [按地区筛选]
Filter-HK: &Filter-HK '香港|HK|HongKong'
Filter-TW: &Filter-TW '台湾|TW|Taiwan'
Filter-US: &Filter-US '美国|US|America'
Filter-UK: &Filter-UK '英国|UK|England'
Filter-JP: &Filter-JP '日本|JP|Japan'
Filter-KR: &Filter-KR '韩国|KR|Korea'
Filter-SG: &Filter-SG '新加坡|SG|Singapore'

# ======= 静态节点 =======
proxies:
    - { name: "usa", type: hysteria2, server: 34.96.136.44, port: 55555, password: e3a5bb40be52de65, udp: true, skip-cert-verify: true, sni: apps.apple.com }
 
# ======= 订阅节点 =======
proxy-providers:
  Sub:
    <<: *pr
    url: "订阅链接"
    path: ./profiles/proxies/subscription.yaml

# ======= 策略组 =======
proxy-groups:
  - {name: Proxy, type: select, proxies: [HK,TW,US,UK,JP,KR,SG,DIRECT,Select]}
  - {name: Select, type: select, use: [Sub]}

  - {name: HK, <<: *failover, filter: *Filter-HK}
  - {name: TW, <<: *failover, filter: *Filter-TW}
  - {name: US, <<: *failover, filter: *Filter-US}
  - {name: UK, <<: *failover, filter: *Filter-UK}  
  - {name: JP, <<: *failover, filter: *Filter-JP}
  - {name: KR, <<: *failover, filter: *Filter-KR}
  - {name: SG, <<: *failover, filter: *Filter-SG}  

rule-providers:
  reject:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: /profiles/rules/reject.txt

  icloud:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: /profiles/rules/icloud.txt

  apple:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: /profiles/rules/apple.txt

  google:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: /profiles/rules/google.txt

  proxy:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: /profiles/rules/proxy.txt

  direct:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: /profiles/rules/direct.txt

  private:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: /profiles/rules/private.txt

  gfw:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: /profiles/rules/gfw.txt

  tld-not-cn:
    <<: *RuleSet
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt"
    path: /profiles/rules/tld-not-cn.txt

  telegramcidr:
    <<: *RuleSet
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: /profiles/rules/telegramcidr.txt

  cncidr:
    <<: *RuleSet
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: /profiles/rules/cncidr.txt

  lancidr:
    <<: *RuleSet
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: /profiles/rules/lancidr.txt

  applications:
    <<: *RuleSet
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: /profiles/rules/applications.txt

rules:
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
#  - RULE-SET,reject,REJECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,Proxy
  - RULE-SET,proxy,Proxy
  - RULE-SET,direct,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT
  - RULE-SET,telegramcidr,Proxy
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
