# ==================== 锚点配置 ====================
# 订阅锚点
PR: &PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}

# 策略锚点
UT: &UT {type: url-test, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}
FB: &FB {type: fallback, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}

# 规则锚点
DO: &DO {type: http, behavior: domain, format: mrs, interval: 86400}
IP: &IP {type: http, behavior: ipcidr, format: mrs, interval: 86400}

# 地区筛选
FilterHK: &FilterHK '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?!.*(排除1|排除2|5x)).*$'
FilterSG: &FilterSG '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*(排除1|排除2|5x)).*$'
FilterJP: &FilterJP '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(排除1|排除2|5x)).*$'
FilterKR: &FilterKR '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South))(?!.*(排除1|排除2|5x)).*$'
FilterUS: &FilterUS '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(排除1|排除2|5x)).*$'
FilterTW: &FilterTW '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH))(?!.*(排除1|排除2|5x)).*$'
FilterEU: &FilterEU '^(?=.*(?i)(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU))(?!.*(排除1|排除2|5x)).*$'
FilterOT: &FilterOT '^(?!.*(DIRECT|直接连接|美|港|坡|台|新|日|韩|奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW))'
FilterAL: &FilterAL '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# 节点排序
SelectAL: &SelectAL   {type: select, proxies: [故障转移, 狮城自动, 香港自动, 台湾自动, 日本自动, 韩国自动, 美国自动, 欧洲自动, 🚀]}
SelectOne: &SelectOne {type: select, proxies: [♻️, 狮城自动, 香港自动, 台湾自动, 美国自动, 欧洲自动, 日本自动, 韩国自动]}
SelectAI: &SelectAI   {type: select, proxies: [狮城自动, ♻️, 香港自动, 台湾自动, 美国自动, 日本自动, 韩国自动, 欧洲自动]}

# ==================== 代理提供者 ====================
proxy-providers:
  
  优先: {<<: *PR, url: 'https://jsjc.cfd/api/v1/client/subscribe?token=800e31d1172f2bddbed1cb88560ae0c7', override: {additional-prefix: '[优] '}}
  
  备用: {<<: *PR, url: '备用机场', override: {additional-prefix: '[备] '}}

# ==================== 核心配置 ====================
# 基础配置
mode: rule
port: 7890
socks-port: 7891
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true

log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600

# 实验功能
experimental:
  quic-go-disable-gso: true  


# 配置存储
profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN模式
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
    
# DNS配置
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - rule-set:Direct
    - rule-set:Private
    - rule-set:China
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com

# ==================== 策略组 ====================
proxy-groups:
  - {name: ♻️,  <<: *SelectAL}
  - {name: 🛩️,  <<: *SelectAI}
  - {name: 🌈,  <<: *SelectOne}  
  - {name: 🚀,  type: select, include-all: true, filter: *FilterAL}
  
  - {name: 故障转移,  <<: *FB, proxies: [香港自动, 台湾自动, 狮城自动, 日本自动, 韩国自动, 美国自动, 🚀]}
  - {name: 🇨🇳,  type: select, proxies: [DIRECT], hidden: true}
  - {name: 香港自动,  <<: *UT, filter: *FilterHK, include-all: true}
  - {name: 台湾自动,  <<: *UT, filter: *FilterTW, include-all: true}
  - {name: 日本自动,  <<: *UT, filter: *FilterJP, include-all: true}
  - {name: 狮城自动,  <<: *UT, filter: *FilterSG, include-all: true}
  - {name: 韩国自动,  <<: *UT, filter: *FilterKR, include-all: true}
  - {name: 美国自动,  <<: *UT, filter: *FilterUS, include-all: true}
  - {name: 欧洲自动,  <<: *UT, filter: *FilterEU, include-all: true}

# ==================== 规则集 ====================

rule-providers: 
  Private:        {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs}
  Direct:         {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs}
