# ===== 锚点定义 =====
BasePR: &BasePR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}

BaseUT: &BaseUT {type: url-test, interval: 200, lazy: true, url: 'https://www.google.com/generate_204',include-all-providers: true, hidden: true}
BaseFB: &BaseFB {type: fallback, interval: 200, lazy: true, url: 'https://www.google.com/generate_204',include-all-providers: true, hidden: true}

BaseDO: &BaseDO {type: http, behavior: domain, format: mrs, interval: 86400}
BaseIP: &BaseIP {type: http, behavior: ipcidr, format: mrs, interval: 86400}
BaseMY: &BaseMY {type: http, behavior: domain, format: text, interval: 86400}

# ===== 订阅管理 =====
proxy-providers:
  优先: {<<: *BasePR, url: '订阅链接', override: {additional-prefix: '[优] '}}
  备用: {<<: *BasePR, url: '备用机场', override: {additional-prefix: '[备] '}}

# ===== 节点列表 =====
proxies:

  - {name: "usd", type: tuic, server: ip1.758733.xyz, port: 10088, sni: apple.com, skip-cert-verify: true, alpn: [h3], udp: true, congestion-controller: bbr, disable-sni: false, password: dongtaiwang.com, udp-relay-mode: native, uuid: 9bbd1f42-7ae7-4239-bd10-a68de95e3295, version: 5}
  - {name: "usc", type: anytls, server: 45.221.98.14, port: 59901, password: dongtaiwang.com, sni: "", skip-cert-verify: true, client-fingerprint: chrome, alpn: [h2, http/1.1], udp: true, disable-sni: true, fp: chrome}
  - {name: "usb", type: mieru, server: 151.242.183.49, port: 11000, multiplexing: MULTIPLEXING_LOW, password: dongtaiwang.com, transport: TCP, username: dongtaiwang.com}
  - {name: "usa", type: mieru, server: 157.254.223.48, port: 33990, multiplexing: MULTIPLEXING_LOW, password: dongtaiwang.com, transport: TCP, username: dongtaiwang.com}

# ===== 分流策略 =====
proxy-groups:

  - {name: Proxy,  type: select, proxies: [Select, Static, HK, TW, SG, JP, KR, US, EU, UN]}
  - {name: Select, type: select, include-all-providers: true}
  - {name: Static, type: select, proxies: [usa,usb,usc,usd]}
  
  - {name: SG,  <<: *BaseUT, filter: "🇸🇬|SG|狮城|新加坡|Singapore"}
  - {name: HK,  <<: *BaseUT, filter: "🇭🇰|HK|香港|HongKong"}
  - {name: TW,  <<: *BaseUT, filter: "🇹🇼|TW|台湾|TaiWan"}
  - {name: JP,  <<: *BaseUT, filter: "🇯🇵|JP|日本|Japan"}
  - {name: KR,  <<: *BaseUT, filter: "🇰🇷|KR|韩国|Korean"}
  - {name: US,  <<: *BaseUT, filter: "🇺🇸|US|美国|America"}
  - {name: EU,  <<: *BaseUT, filter: "🇪🇺|UK|英国|FA|法国|DE|德国|CH|瑞士|SE|瑞典|DK|丹麦|FI|芬兰|GR|希腊|IT|意大利|ES|西班牙|PT|葡萄牙|IE|爱尔兰|UA|乌克兰"}
  - {name: UN,  <<: *BaseUT, filter: "CA|加拿大|TH|泰国|VN|越南|BR|巴西|CL|智利|AU|澳大利亚|IL|以色列|RU|俄罗斯|MX|墨西哥|NZ|新西兰"} 

# ===== 基础配置 =====
port: 7890
mode: rule
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true

log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600

# ===== 虚拟网卡 =====
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ===== 实验功能 =====
experimental:
  quic-go-disable-gso: true  

# ===== 配置存储 =====
profile:
  store-selected: true
  store-fake-ip: true

# ===== 流量嗅探 =====
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ===== DNS配置 =====
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
    - geosite:category-ntp
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  respect-rules: true

    
# ===== 规则订阅 =====
rule-providers: 

# 域名规则
  direct:    {<<: *BaseDO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/rule/direct.mrs, 	path: ./Rules/direct.mrs}
  proxy:     {<<: *BaseDO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/rule/proxy.mrs, 	path: ./Rules/proxy.mrs}
  special:   {<<: *BaseDO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/rule/special.mrs, path: ./Rules/special.mrs}
  reject:    {<<: *BaseDO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/rule/reject.mrs, 	path: ./Rules/reject.mrs}
 
# IP规则
  directip:  {<<: *BaseDO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/rule/directip.mrs, path: ./Rules/directip.mrs}
  proxyip:   {<<: *BaseDO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/rule/proxyip.mrs,  path: ./Rules/proxyip.mrs}
  specialip: {<<: *BaseDO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/rule/special.mrs,  path: ./Rules/specialip.mrs}

# ===== 规则路由 =====
rules: 

# 拦截规则
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT
  - RULE-SET,reject,REJECT

# 域名规则
  - RULE-SET,direct,DIRECT
  - RULE-SET,special,Select
  - RULE-SET,proxy,Proxy
  
# IP规则
  - RULE-SET,directip,DIRECT,no-resolve
  - RULE-SET,specialip,Select,no-resolve
  - RULE-SET,proxyip,Proxy,no-resolve

# 兜底规则
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
