# ==================== 规则路由 ====================
rules: 
  # 拦截规则
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT  # 阻止海外 QUIC

  # 域名规则
  - RULE-SET,Private,🇨🇳
  - RULE-SET,Direct,🇨🇳
  - RULE-SET,AppleCN,🇨🇳
  - RULE-SET,Download,🇨🇳
  - RULE-SET,XPTV,🇨🇳
  - RULE-SET,AI,🛩️
  - RULE-SET,Telegram,🌈
  - RULE-SET,SocialMedia,🌈
  - RULE-SET,YouTube,🌈
  - RULE-SET,Spotify,🌈
  - RULE-SET,Netflix,🌈
  - RULE-SET,Disney,🌈
  - RULE-SET,HBO,🌈
  - RULE-SET,Proxy,♻️
  - RULE-SET,China,🇨🇳
  # IP规则
  - RULE-SET,PrivateIP,🇨🇳,no-resolve
  - RULE-SET,TelegramIP,🌈,no-resolve
  - RULE-SET,SocialMediaIP,🌈,no-resolve
  - RULE-SET,NetflixIP,🌈,no-resolve
  - RULE-SET,ProxyIP,♻️,no-resolve
  - RULE-SET,ChinaIP,🇨🇳
  # 兜底规则
  - MATCH,♻️
