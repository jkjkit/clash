# ==================== 锚点配置 ====================
# 订阅锚点
PR: &PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}}

# 策略锚点
UT: &UT {type: url-test, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}
FB: &FB {type: fallback, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}

# 规则锚点
DO: &DO {type: http, behavior: domain, format: mrs, interval: 86400}
IP: &IP {type: http, behavior: ipcidr, format: mrs, interval: 86400}

# ==================== 订阅管理 ====================
proxy-providers:
  
  优先: {<<: *PR, url: '订阅链接', override: {additional-prefix: '[优] '}}
  备用: {<<: *PR, url: '备用机场', override: {additional-prefix: '[备] '}}

# ==================== 核心配置 ====================
# 基础配置
mode: rule
port: 7890
socks-port: 7891
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true

log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600

# 认证配置
authentication:
  - mihomo:admin
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8

# 实验功能
experimental:
  quic-go-disable-gso: true  
     
# 管理面板
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: admin

# 配置存储
profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN模式
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
    
# DNS配置
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - rule-set:Direct
    - rule-set:Private
    - rule-set:China
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com

# ==================== 策略组 ====================
proxy-groups:
  - {name: Proxy, type: select, proxies: [Select,DIRECT,Static,SG,HK,TW,US,UK,JP,KR]}
  - {name: Select, type: select, include-all-providers: true}
  - {name: Static, type: select, proxies: [usa,usb,usc,usd]}
  - {name: Direct, type: select, proxies: [DIRECT]}
  - {name: Match, type: select, proxies: [Failover]}

  - {name: Failover,  <<: *FB, include-all-providers: true]}

  - {name: HK, <<: *UT, filter: '香港|🇭🇰|HK|HongKong'}
  - {name: TW, <<: *UT, filter: '台湾|🇹🇼|TW|Taiwan'}
  - {name: US, <<: *UT, filter: '美国|🇺🇸|US|America'}
  - {name: EU, <<: *UT, filter: '德国|🇩🇪|法国|🇫🇷|英国|🇬🇧|瑞士|🇨🇭|芬兰|🇫🇮|希腊|🇬🇷|奥地利|🇦🇹|意大利|🇮🇹'}
  - {name: JP, <<: *UT, filter: '日本|🇯🇵|JP|Japan'}
  - {name: KR, <<: *UT, filter: '韩国|🇰🇷|KR|Korea'}
  - {name: SG, <<: *UT, filter: '狮城|🇸🇬|SG|Singapore|新加坡'}
  
# ==================== 规则订阅 ====================

rule-providers:
  # 域名规则
  Tracking:       {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Tracking.mrs}
  Advertising:    {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Advertising.mrs} 
  Private:        {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs}
  Direct:         {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs}
  AppleCN:        {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AppleCN.mrs}
  Download:       {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs}
  XPTV:           {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/XPTV.mrs}
  AI:             {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs}
  Telegram:       {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs}
  SocialMedia:    {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/SocialMedia.mrs}  
  YouTube:        {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/YouTube.mrs}
  Spotify:        {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Spotify.mrs}
  Netflix:        {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Netflix.mrs}
  Disney:         {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Disney.mrs}
  HBO:            {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/HBO.mrs}
  Proxy:          {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs}
  China:          {<<: *DO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs}
  # IP规则
  AdvertisingIP:  {<<: *IP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Advertising.mrs} 
  TelegramIP:     {<<: *IP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs}  
  SocialMediaIP:  {<<: *IP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/SocialMedia.mrs}  
  NetflixIP:      {<<: *IP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Netflix.mrs}
  ProxyIP:        {<<: *IP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs} 
  ChinaIP:        {<<: *IP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs}
  PrivateIP:      {<<: *IP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Private.mrs}

# ==================== 规则路由 ====================
rules: 
  # 拦截规则
  - RULE-SET,Tracking,REJECT
  - RULE-SET,Advertising,REJECT  

  # 域名规则
  - RULE-SET,Private,Direct
  - RULE-SET,Direct,Direct
  - RULE-SET,AppleCN,Direct
  - RULE-SET,Download,Direct
  - RULE-SET,XPTV,Direct
  - RULE-SET,AI,Select
  - RULE-SET,Telegram,Proxy
  - RULE-SET,SocialMedia,Proxy
  - RULE-SET,YouTube,Proxy
  - RULE-SET,Spotify,Proxy
  - RULE-SET,Netflix,Proxy
  - RULE-SET,Disney,Proxy
  - RULE-SET,HBO,Proxy
  - RULE-SET,Proxy,Proxy
  - RULE-SET,China,Direct
  # IP规则
  - RULE-SET,AdvertisingIP,REJECT,no-resolve  
  - RULE-SET,PrivateIP,Direct,no-resolve
  - RULE-SET,TelegramIP,Proxy,no-resolve
  - RULE-SET,SocialMediaIP,Proxy,no-resolve
  - RULE-SET,NetflixIP,Proxy,no-resolve
  - RULE-SET,ProxyIP,Proxy,no-resolve
  - RULE-SET,ChinaIP,Direct
  # 兜底规则
  - MATCH,Proxy
