# ======= 基础配置 =======
mixed-port: 7890
mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true

log-level: warning
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600

experimental:
  quic-go-disable-gso: true 

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query

  nameserver-policy:
    "geosite:cn": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:apple,microsoft,category-games@cn": [https://dns.alidns.com/dns-query]

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "builtin:*"
    - "stun.*.*"
    - "+.push.apple.com"
    - "vdt-data.volceapplog.com"
    - "heartbeat.dm.origin.com"
    - "*.msftnscache.com"
    - "*.msftconnecttest.com"

# ======= 锚点定义 =======
pr: &pr {type: http, interval: 86400, health-check: {enable: true, interval: 60, url: "http://www.gstatic.com/generate_204"}}
at: &at {type: url-test, interval: 300, tolerance: 20, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, include-all-providers: true, hidden: true}
fb: &fb {type: fallback, interval: 300, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, include-all-providers: true, hidden: true}
DO: &DO {type: http, behavior: domain, format: text, interval: 86400}
IP: &IP {type: http, behavior: ipcidr, format: text, interval: 86400}

# ======= 静态节点 =======
proxies:
  - { name: usa, type: mieru, server: 151.242.183.49, port: 11000, multiplexing: MULTIPLEXING_LOW, password: dongtaiwang.com, transport: TCP, username: dongtaiwang.com}
  - { name: usb, type: mieru, server: 157.254.223.48, port: 33990, multiplexing: MULTIPLEXING_LOW, password: dongtaiwang.com, transport: TCP, username: dongtaiwang.com}
  - { name: usc, type: vless, server: saas.sin.fan, port: 443, network: ws, tls: true, servername: sni.111000.dynv6.net, UUID: 6202b230-417c-4d8e-b624-0f71afa9c75d, ws-opts: { path: "/?ed=2560&proxyip=ip.111000.de5.net:443", headers: { Host: sni.111000.dynv6.net } }, ech-opts: { enable: true, query-server-name: cloudflare-ech.com } }
  - { name: usd, type: vless, server: freeyx.cloudflare88.eu.org, port: 443, network: ws, tls: true, servername: sni.111000.dynv6.net, UUID: 6202b230-417c-4d8e-b624-0f71afa9c75d, ws-opts: { path: "/?ed=2560&proxyip=ip.111000.de5.net:443", headers: { Host: sni.111000.dynv6.net } }, ech-opts: { enable: true, query-server-name: cloudflare-ech.com } }

# ======= 订阅节点 =======
proxy-providers:
  优先: {<<: *pr, url: '订阅链接', override: {additional-prefix: '[优] '}}
  备用: {<<: *pr, url: '备用机场', override: {additional-prefix: '[备] '}}

# ======= 策略组 =======
proxy-groups:
  - {name: Proxy, type: select, proxies: [Select,DIRECT,Static,SG,HK,TW,US,UK,JP,KR]}
  - {name: Select, type: select, include-all-providers: true}
  - {name: Static, type: select, proxies: [usa,usb,usc,usd]}
  
  - {name: HK, <<: *at, filter: '香港|HK|HongKong'}
  - {name: TW, <<: *at, filter: '台湾|TW|Taiwan'}
  - {name: US, <<: *at, filter: '美国|US|America'}
  - {name: UK, <<: *at, filter: '英国|UK|England'}
  - {name: JP, <<: *at, filter: '日本|JP|Japan'}
  - {name: KR, <<: *at, filter: '韩国|KR|Korea'}
  - {name: SG, <<: *at, filter: '新加坡|SG|Singapore'}

# ======= 分流规则 =======
rule-providers:
  do-direct:  {<<: *DO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/domain/direct.list}
  do-proxy:   {<<: *DO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/domain/proxy.list}
  do-reject:  {<<: *DO, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/domain/reject.list}
  ip-direct:  {<<: *IP, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/ipcidr/direct.list}
  ip-proxy:   {<<: *IP, url: https://cdn.jsdelivr.net/gh/jkjkit/clash@main/ipcidr/proxy.list}

rules:
  - RULE-SET,do-reject,REJECT
  - RULE-SET,do-direct,DIRECT
  - RULE-SET,do-proxy,Proxy
  - RULE-SET,ip-direct,DIRECT
  - RULE-SET,ip-proxy,Proxy
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
