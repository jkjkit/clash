# ===== 锚点定义 =====
BasePR: &BasePR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}

BaseUT: &BaseUT {type: url-test, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}
BaseFB: &BaseFB {type: fallback, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}

BaseDO: &BaseDO {type: http, behavior: domain, format: mrs, interval: 86400}
BaseIP: &BaseIP {type: http, behavior: ipcidr, format: mrs, interval: 86400}
BaseMY: &BaseMY {type: http, behavior: domain, format: text, interval: 86400}

# ===== 订阅管理 =====
proxy-providers:
  优质服务商: {<<: *BasePR, url: '订阅链接', override: {additional-prefix: '[优] '}}
  备用服务商: {<<: *BasePR, url: '备用订阅', override: {additional-prefix: '[备] '}}

# ===== 节点列表 =====
proxies:

# ===== 分流策略 =====
proxy-groups:

  - {name: Proxy,  type: select, proxies: [Select, DIRECT, HK, TW, SG, JP, KR, US, EU, UN]}
  - {name: Select, type: select, include-all: true}
  
  - {name: SG,  <<: *BaseUT, filter: "🇸🇬|SG|狮城|新加坡|Singapore", include-all: true}
  - {name: HK,  <<: *BaseUT, filter: "🇭🇰|HK|香港|HongKong", include-all: true}
  - {name: TW,  <<: *BaseUT, filter: "🇹🇼|TW|台湾|TaiWan", include-all: true}
  - {name: JP,  <<: *BaseUT, filter: "🇯🇵|JP|日本|Japan", include-all: true}
  - {name: KR,  <<: *BaseUT, filter: "🇰🇷|KR|韩国|Korean", include-all: true}
  - {name: US,  <<: *BaseUT, filter: "🇺🇸|US|美国|America", include-all: true}
  - {name: EU,  <<: *BaseUT, filter: "🇪🇺|UK|英国|FA|法国|DE|德国|CH|瑞士|SE|瑞典|DK|丹麦|FI|芬兰|GR|希腊|IT|意大利|ES|西班牙|PT|葡萄牙|IE|爱尔兰|UA|乌克兰", include-all: true}
  - {name: UN,  <<: *BaseUT, filter: "CA|加拿大|TH|泰国|VN|越南|BR|巴西|CL|智利|AU|澳大利亚|IL|以色列|RU|俄罗斯|MX|墨西哥|NZ|新西兰", include-all: true} 

# ===== 基础配置 =====
port: 7890
mode: rule
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true

log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600

# ===== 虚拟网卡 =====
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ===== 认证配置 =====
authentication:
  - mihomo:yyds666
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8
  
# ===== 管理面板 =====
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: yyds666

# ===== 实验功能 =====
experimental:
  quic-go-disable-gso: true  

# ===== 配置存储 =====
profile:
  store-selected: true
  store-fake-ip: true

# ===== 流量嗅探 =====
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# =====DNS配置 =====
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - rule-set:Direct
    - rule-set:Private
    - rule-set:China
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com
  
# ===== 规则订阅 =====
rule-providers: 

  MyDirect:       {<<: *BaseMY, url: https://raw.githubusercontent.com/jkjkit/clash/refs/heads/main/domain/direct.list}
  MyProxy:        {<<: *BaseMY, url: https://raw.githubusercontent.com/jkjkit/clash/refs/heads/main/domain/proxy.list}

  Tracking:       {<<: *BaseDO, url: https://github.com/666OS/rules/blob/release/mihomo/domain/Tracking.mrs}
  Advertising:    {<<: *BaseDO, url: https://github.com/666OS/rules/blob/release/mihomo/domain/Advertising.mrs}
  Private:        {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs}
  Direct:         {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs}
  AppleCN:        {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AppleCN.mrs}
  Download:       {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs}
  XPTV:           {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/XPTV.mrs}
  AI:             {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs}
  Telegram:       {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs}
  SocialMedia:    {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/SocialMedia.mrs}  
  YouTube:        {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/YouTube.mrs}
  Spotify:        {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Spotify.mrs}
  Netflix:        {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Netflix.mrs}
  Disney:         {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Disney.mrs}
  HBO:            {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/HBO.mrs}
  Proxy:          {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs}
  China:          {<<: *BaseDO, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs}
  # IP规则
  TelegramIP:     {<<: *BaseIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs}  
  SocialMediaIP:  {<<: *BaseIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/SocialMedia.mrs}  
  NetflixIP:      {<<: *BaseIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Netflix.mrs}
  ProxyIP:        {<<: *BaseIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs} 
  ChinaIP:        {<<: *BaseIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs}
  PrivateIP:      {<<: *BaseIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Private.mrs}

# ===== 规则路由 =====
rules: 
  # 拦截规则
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT  # 阻止海外 QUIC
  - RULE-SET,Tracking,REJECT
  - RULE-SET,Advertising,REJECT
  
  - RULE-SET,MyDirect,DIRECT
  - RULE-SET,MyProxy,Proxy

  # 域名规则
  - RULE-SET,Private,DIRECT
  - RULE-SET,Direct,DIRECT
  - RULE-SET,AppleCN,DIRECT
  - RULE-SET,Download,DIRECT
  - RULE-SET,XPTV,DIRECT
  - RULE-SET,AI,Select
  - RULE-SET,Telegram,Proxy
  - RULE-SET,SocialMedia,Proxy
  - RULE-SET,YouTube,Proxy
  - RULE-SET,Spotify,Proxy
  - RULE-SET,Netflix,Proxy
  - RULE-SET,Disney,Proxy
  - RULE-SET,HBO,Proxy
  - RULE-SET,Proxy,Proxy
  - RULE-SET,China,DIRECT
  # IP规则
  - RULE-SET,PrivateIP,DIRECT,no-resolve
  - RULE-SET,TelegramIP,Proxy,no-resolve
  - RULE-SET,SocialMediaIP,Proxy,no-resolve
  - RULE-SET,NetflixIP,Proxy,no-resolve
  - RULE-SET,ProxyIP,Proxy,no-resolve
  - RULE-SET,ChinaIP,DIRECT
  # 兜底规则
  - MATCH,Proxy
