port: 7890
socks-port: 7891

allow-lan: true
mode: rule
log-level: info
ipv6: true
udp: true

unified-delay: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

geox-url:
  geoip: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat'
  geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

dns:
  enable: true
  prefer-h3: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - +.lan
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

# 锚点 - 节点筛选
FilterHK: &FilterHK '香港|HK|HongKong'
FilterTW: &FilterTW '台湾|TW|Taiwan'
FilterUS: &FilterUS '美国|US|America'
FilterUK: &FilterUK '英国|UK|England'
FilterJP: &FilterJP '日本|JP|Japan'
FilterKR: &FilterKR '韩国|KR|Korea'
FilterSG: &FilterSG '新加坡|SG|Singapore'
FilterUN: &FilterUN '^(?!.*(香港|HK|HongKong|台湾|TW|Taiwan|美国|US|America|英国|UK|England|日本|JP|Japan|韩国|KR|Korea|新加坡|SG|Singapore)).*$'

# 锚点 - 自动选择 [每 6 秒一次惰性健康检查，容差 20ms，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
UrlTest: &UrlTest {type: url-test, interval: 6, tolerance: 20, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}
# 锚点 - 故障转移 [每 6 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
FallBack: &FallBack {type: fallback, interval: 6, lazy: true, url: 'http://www.google.com/blank.html', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}

proxies:
  
# 策略组
proxy-groups: 
  - {name: Proxy, type: select, proxies: [HK,TW,US,UK,JP,KR,SG,DIRECT,Select,Static]}
  - {name: All,  type: select, include-all: true }
  - {name: Static, type: load-balance, proxies: [usa,usb,usc,usd]}

  - {name: All,  type: select, include-all: true }
  - {name: HK, <<: *UrlTest, filter: *FilterHK, include-all: true}
  - {name: TW, <<: *UrlTest, filter: *FilterTW, include-all: true}
  - {name: US, <<: *UrlTest, filter: *FilterUS, include-all: true}
  - {name: UK, <<: *UrlTest, filter: *FilterUK, include-all: true}
  - {name: JP, <<: *UrlTest, filter: *FilterJP, include-all: true}
  - {name: KR, <<: *UrlTest, filter: *FilterKR, include-all: true}
  - {name: SG, <<: *UrlTest, filter: *FilterSG, include-all: true}

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
